name: NuGet

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: true

on:
  # ручной запуск: укажи версию руками
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия пакета, напр. 0.2.0'
        required: true
        default: ''
  # автозапуск по тегу
  push:
    tags:
      - 'v*'
      - '*.*.*'

env:
  PROJECT_PATH: Avalonia.DrmKit/Avalonia.DrmKit.csproj

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build "$PROJECT_PATH" -c Release --no-restore

      - name: Resolve version (from dispatch input or tag)
        id: ver
        shell: bash
        run: |
          VERSION_INPUT="${{ github.event.inputs.version }}"
          if [[ -n "$VERSION_INPUT" ]]; then
            VERSION="$VERSION_INPUT"
          else
            RAW="${GITHUB_REF#refs/tags/}"
            if [[ "$RAW" == v* ]]; then VERSION="${RAW#v}"; else VERSION="$RAW"; fi
          fi
          [[ -z "$VERSION" ]] && { echo "ERROR: empty version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Pack
        run: dotnet pack "$PROJECT_PATH" -c Release -o artifacts --no-build -p:Version="${{ steps.ver.outputs.version }}"

      - name: Show nuspec (ID/Version)
        run: |
          FILE=$(ls artifacts/*.nupkg | head -n1)
          echo "NUPKG=$FILE"
          unzip -p "$FILE" *.nuspec | sed -n '1,120p'

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  publish:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - name: Detect id/version
        id: detect
        shell: bash
        run: |
          FILE=$(ls artifacts/*.nupkg | head -n1)
          ID=$(unzip -p "$FILE" *.nuspec | sed -n 's:.*<id>\(.*\)</id>.*:\1:p' | head -n1)
          VER=$(unzip -p "$FILE" *.nuspec | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n1)
          echo "Package: $ID $VER"
          echo "id=$ID"  >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Guard: disallow reserved Avalonia.* prefix
        shell: bash
        run: |
          if echo "${{ steps.detect.outputs.id }}" | grep -qiE '^Avalonia\.'; then
            echo "ERROR: PackageId with reserved prefix 'Avalonia.' запрещён, смените PackageId."; exit 1;
          fi

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -e
          FILE=$(ls artifacts/*.nupkg | head -n1)
          echo "Pushing: $FILE"
          dotnet nuget push "$FILE" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
