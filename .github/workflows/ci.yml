name: NuGet

# Мьютекс: один запуск на тег/реф. Исключает одновременные пуши.
concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: true

on:
  # публикация только по тегам, чтобы не дёргать руками:
  push:
    tags:
      - 'v*'        # v0.1.0
      - '*.*.*'     # 0.1.0

env:
  PROJECT_PATH: Avalonia.DrmKit/Avalonia.DrmKit.csproj

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build "$PROJECT_PATH" -c Release --no-restore

      - name: Pack (version from tag)
        run: |
          RAW="${GITHUB_REF#refs/tags/}"
          if [[ "$RAW" == v* ]]; then VERSION="${RAW#v}"; else VERSION="$RAW"; fi
          [[ -z "$VERSION" ]] && { echo "ERROR: empty version"; exit 1; }
          echo "Packing version $VERSION"
          dotnet pack "$PROJECT_PATH" -c Release -o artifacts --no-build -p:Version="$VERSION"

      - name: Show nuspec (ID/Version)
        run: |
          FILE=$(ls artifacts/*.nupkg | head -n1)
          unzip -p "$FILE" *.nuspec | sed -n '1,200p'

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  publish:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - name: Detect id/version
        id: detect
        shell: bash
        run: |
          FILE=$(ls artifacts/*.nupkg | head -n1)
          ID=$(unzip -p "$FILE" *.nuspec | sed -n 's:.*<id>\(.*\)</id>.*:\1:p' | head -n1)
          VER=$(unzip -p "$FILE" *.nuspec | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n1)
          echo "id=$ID"  >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Package: $ID $VER"

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -e
          echo "Pushing ID=${{ steps.detect.outputs.id }} VER=${{ steps.detect.outputs.ver }}"
          # Если версия уже занята (в т.ч. валидация/анлист) — nuget вернёт 409.
          # --skip-duplicate оставляем, чтобы run не «краснел».
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
