name: NuGet

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия пакета (например, 0.1.0)'
        required: true
        default: ''
  push:
    tags:
      - 'v*'
      - '*.*.*'

env:
  PROJECT_PATH: Avalonia.DrmKit/Avalonia.DrmKit.csproj

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build "$PROJECT_PATH" -c Release --no-restore

      - name: Test
        run: dotnet test Avalonia.DrmKit.Tests/Avalonia.DrmKit.Tests.csproj -c Release

      - name: Resolve version (from dispatch input or tag)
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF#refs/tags/}"
            if [[ "$RAW" == v* ]]; then VERSION="${RAW#v}"; else VERSION="$RAW"; fi
          fi
          if [[ -z "$VERSION" ]]; then
            echo "ERROR: empty version"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Pack
        run: dotnet pack "$PROJECT_PATH" -c Release -o artifacts --no-build -p:Version="${{ steps.ver.outputs.version }}"

      - name: Show nuspec (ID/Version)
        shell: bash
        run: |
          FILE=$(ls artifacts/*.nupkg | head -n1)
          echo "NUPKG=$FILE"
          unzip -p "$FILE" "*.nuspec" | sed -n '1,150p'

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  publish:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - name: Download nupkg
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - name: Read PackageId/Version
        id: meta
        shell: bash
        run: |
          FILE=$(ls artifacts/*.nupkg | head -n1)
          ID=$(unzip -p "$FILE" "*.nuspec" | sed -n 's/.*<id>\(.*\)<\/id>.*/\1/p' | head -n1)
          VER=$(unzip -p "$FILE" "*.nuspec" | sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' | head -n1)
          echo "Package: $ID $VER"
          echo "id=$ID"  >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Guard reserved prefix Avalonia.*
        if: startsWith(steps.meta.outputs.id, 'Avalonia.')
        run: |
          echo "ERROR: PackageId с префиксом 'Avalonia.' зарезервирован NuGet (prefix reservation). Смените PackageId."; 
          exit 1

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -e
          FILE=$(ls artifacts/*.nupkg | head -n1)
          echo "Pushing: $FILE"
          dotnet nuget push "$FILE" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
