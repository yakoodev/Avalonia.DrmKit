name: NuGet

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'

env:
  PROJECT_PATH: Avalonia.DrmKit/Avalonia.DrmKit.csproj

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build "$PROJECT_PATH" -c Release --no-restore

      - name: Resolve versions from tag
        id: ver
        shell: bash
        run: |
          RAW="${GITHUB_REF#refs/tags/}"
          if [[ "$RAW" == v* ]]; then VERSION="${RAW#v}"; else VERSION="$RAW"; fi
          [[ -z "$VERSION" ]] && { echo "ERROR: empty version from tag"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "fallback=${VERSION}-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Main: $VERSION"
          echo "Fallback: ${VERSION}-ci.${GITHUB_RUN_NUMBER}"

      - name: Pack (main)
        run: dotnet pack "$PROJECT_PATH" -c Release -o artifacts --no-build -p:Version="${{ steps.ver.outputs.version }}"

      - name: Pack (fallback)
        run: dotnet pack "$PROJECT_PATH" -c Release -o artifacts --no-build -p:Version="${{ steps.ver.outputs.fallback }}"

      - name: Show nuspecs
        run: |
          for f in artifacts/*.nupkg; do
            echo "== $f =="
            unzip -p "$f" *.nuspec | sed -n '1,80p'
          done

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  publish:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - name: Detect main/fallback files
        id: pick
        shell: bash
        run: |
          MAIN=""
          FALL=""
          for f in artifacts/*.nupkg; do
            if [[ "$f" == *"-ci."* ]]; then FALL="$f"; else MAIN="$f"; fi
          done
          [[ -z "$MAIN" ]] && { echo "No main nupkg found"; exit 1; }
          [[ -z "$FALL" ]] && { echo "No fallback nupkg found"; exit 1; }
          echo "main=$MAIN"     >> "$GITHUB_OUTPUT"
          echo "fallback=$FALL" >> "$GITHUB_OUTPUT"
          echo "MAIN: $MAIN"
          echo "FALLBACK: $FALL"

      - name: Push MAIN to NuGet.org (no skip-duplicate)
        id: push_main
        continue-on-error: true
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -e
          FILE="${{ steps.pick.outputs.main }}"
          echo "Pushing MAIN: $FILE"
          dotnet nuget push "$FILE" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY"

      - name: Push FALLBACK to NuGet.org (on MAIN failure)
        if: steps.push_main.outcome != 'success'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -e
          FILE="${{ steps.pick.outputs.fallback }}"
          echo "Pushing FALLBACK: $FILE"
          dotnet nuget push "$FILE" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Summary
        run: |
          echo "MAIN outcome:  ${{ steps.push_main.outcome }}"
